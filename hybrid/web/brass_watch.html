<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass Nixie Watch — functioning model</title>
<style>
  :root{
    --warm:#fff3d8;          /* nixie plasma core */
    --glow:#ffc46b;          /* amber bloom      */
    --dim:#ffd8a0;
    --bg:#07070a;
  }
  html,body{margin:0;background:var(--bg);color:#e8dcc0;
            font:14px/1.45 Georgia,'Times New Roman',serif;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;}

  /* the stage is authored at the background image's native 1024x1024, then scaled to fit */
  .frame{width:min(94vw,620px);aspect-ratio:1/1;position:relative;}
  .stage{position:absolute;top:0;left:0;width:1024px;height:1024px;
         transform-origin:top left;
         background:url('BrassBackground.png') center/1024px 1024px no-repeat;}

  /* every data element is absolutely positioned at MEASURED pixel coords on the 1024 grid.
     The extra -0.12em compensates for the font's descender space: translate(-50%,-50%) centres
     the LINE BOX, which sits the visual centre of digits too low. Using em keeps it proportional
     for every element at every font size. */
  .d{position:absolute;transform:translate(-50%,calc(-50% - 0.12em));color:var(--warm);
     font-weight:700;line-height:1;letter-spacing:.01em;
     text-shadow:0 0 6px rgba(255,196,107,.95),
                 0 0 22px rgba(255,150,40,.55),
                 0 0 46px rgba(255,120,20,.30);}

  .tube{font-size:126px;color:#eaf4ff;          /* nixie discharge: blue-white, not ivory */
        text-shadow:0 0 8px rgba(150,205,255,.95),
                    0 0 26px rgba(70,150,255,.75),
                    0 0 62px rgba(40,110,255,.45);
        /* taller + thinner, like a wire cathode. NOTE: an override must re-state the centring
           translate from .d, because `transform` does not inherit. */
        transform:translate(-50%,calc(-50% - 0.12em)) scaleX(.72) scaleY(1.34);}
  .cnt {font-size:68px;}                        /* the five counter drums               */
  .hr  {font-size:72px;}                        /* left gauge                           */
  .day {font-size:72px;}                        /* right gauge                          */
  .wd  {font-size:30px;color:var(--dim);letter-spacing:.06em;
        text-shadow:0 0 8px rgba(255,180,80,.8);}
  .unit{font-size:20px;color:var(--dim);letter-spacing:.14em;
        text-shadow:0 0 8px rgba(255,170,70,.7);}

  /* a nixie never sits perfectly still: a barely-there flicker */
  @keyframes flicker{0%,100%{opacity:1}47%{opacity:.96}52%{opacity:.99}}
  .tube,.cnt,.hr,.day{animation:flicker 4.5s infinite;}
  /* the pulse on the heart-rate reading */
  @keyframes beat{0%,100%{opacity:1}12%{opacity:.82}24%{opacity:1}}
  .hr{animation:flicker 4.5s infinite, beat 1.05s infinite;}

  .cap{max-width:620px;text-align:center;color:#9d917c;font-size:12.5px;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <div class="stage">
      <!-- TIME — four nixie tubes, live clock, digit centres measured from the background -->
      <div class="d tube" id="h1" style="left:282px; top:256px">1</div>
      <div class="d tube" id="h2" style="left:439px; top:256px">0</div>
      <div class="d tube" id="m1" style="left:581px; top:256px">0</div>
      <div class="d tube" id="m2" style="left:747px; top:260px">9</div>

      <!-- STEPS — four digits, NO separator, right-aligned on drums 2-5 of the five-drum counter
           (drum 1 left blank, as a mechanical counter suppresses a leading digit) -->
      <div class="d cnt" id="s1" style="left:446px; top:600px">8</div>
      <div class="d cnt" id="s2" style="left:504px; top:590px">3</div>
      <div class="d cnt" id="s3" style="left:562px; top:590px">4</div>
      <div class="d cnt" id="s4" style="left:619px; top:590px">2</div>

      <!-- HEART RATE — left gauge, raised onto the measured dial face (centre 209,605 r~110) -->
      <div class="d hr"  id="hr"  style="left:209px; top:618px">72</div>
      <div class="d unit"        style="left:209px; top:670px">BPM</div>

      <!-- DATE — right gauge, centred on ITS measured face (centre 813,657 — the two dials sit at
           different heights, which is why the old date read looked off-centre) -->
      <div class="d wd"  id="wd"  style="left:813px; top:602px">WED</div>
      <div class="d day" id="day" style="left:813px; top:657px">30</div>
      <div class="d unit" id="mon" style="left:813px; top:710px">SEP</div>
    </div>
  </div>
  <p class="cap">Time and date are live from your clock. Heart rate and steps are the fixed mock
  values (72 BPM, 8,342 steps) — this is a functioning layout model, not a live data feed.</p>
</div>

<script>
  // scale the 1024x1024 stage into the frame without distorting the background
  const frame = document.querySelector('.frame');
  const stage = document.querySelector('.stage');
  const fit = () => { stage.style.transform = 'scale(' + (frame.clientWidth / 1024) + ')'; };
  new ResizeObserver(fit).observe(frame);
  fit();

  const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const pad = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);

  function tick() {
    const d = new Date();
    const hh = pad(d.getHours()), mm = pad(d.getMinutes());
    $('h1').textContent = hh[0]; $('h2').textContent = hh[1];
    $('m1').textContent = mm[0]; $('m2').textContent = mm[1];
    $('wd').textContent  = DAYS[d.getDay()];
    $('day').textContent = pad(d.getDate());
    $('mon').textContent = MONTHS[d.getMonth()];
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
